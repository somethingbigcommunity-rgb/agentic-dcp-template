name: fast

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run template self-check (agentic-dcp-template repository only)
        if: github.repository == 'somethingbigcommunity-rgb/agentic-dcp-template' && hashFiles('scripts/ci/fast.sh') == ''
        run: |
          python3 -m py_compile install.py scripts/*.py
          bash -n scripts/*.sh
      - name: Require project fast check
        if: github.repository != 'somethingbigcommunity-rgb/agentic-dcp-template' || hashFiles('scripts/ci/fast.sh') != ''
        run: test -f scripts/ci/fast.sh
      - name: Run project fast check
        if: github.repository != 'somethingbigcommunity-rgb/agentic-dcp-template' || hashFiles('scripts/ci/fast.sh') != ''
        run: bash scripts/ci/fast.sh
